<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Catatan Pemasangan Jaringan</title>
    <style>
        :root {
            --primary-color: #0d6efd;
            --bg-color: #f8f9fa;
            --text-color: #333;
            --border-color: #dee2e6;
            --success-color: #198754;
            --warning-color: #ffc107;
            --info-color: #0dcaf0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
        }
        .header h2 {
            margin-bottom: 5px;
            font-size: 22px;
        }
        .header p {
            margin-top: 0;
            font-size: 14px;
            color: #666;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            opacity: 0.9;
        }
        .header-table {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        .header-table h3 {
            margin: 0;
        }
        .counter-badge {
            display: inline-block;
            background-color: #e9ecef;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            color: var(--primary-color);
            margin-top: 5px;
        }
        
        /* CSS Untuk Fitur Pencarian */
        .search-box {
            margin-bottom: 15px;
            width: 100%;
        }
        .search-box input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--primary-color);
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .search-box input:focus {
            box-shadow: 0 0 5px rgba(13, 110, 253, 0.5);
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn-export {
            background-color: var(--success-color);
            width: auto;
            font-size: 13px;
        }
        .btn-reset {
            background-color: var(--warning-color);
            color: #000;
            width: auto;
            font-size: 13px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table th, table td {
            padding: 10px;
            border: 1px solid var(--border-color);
            text-align: left;
            font-size: 13px;
        }
        table th {
            background-color: var(--primary-color);
            color: white;
            white-space: nowrap;
        }
        table tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        .btn-aksi {
            display: flex;
            gap: 5px;
        }
        .btn-delete {
            background-color: #dc3545;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 4px;
            color: white;
            border: none;
            width: auto;
        }
        .btn-edit {
            background-color: var(--success-color);
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 4px;
            color: white;
            border: none;
            width: auto;
        }
        
        /* CSS Khusus Layar HP */
        @media (max-width: 600px) {
            .grid-2 {
                grid-template-columns: 1fr;
                gap: 0px;
            }
            .header-table {
                flex-direction: column;
                align-items: stretch;
            }
            .header-table > div {
                text-align: center;
            }
            .btn-group {
                flex-direction: column;
            }
            .btn-export, .btn-reset {
                width: 100%;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Sistem Catatan Pemasangan</h2>
        <p>Formulir Pendataan Instalasi Pelanggan Baru</p>
    </div>

    <!-- Form Input -->
    <div class="card">
        <form id="formPemasangan">
            <div class="grid-2">
                <div class="form-group">
                    <label for="tanggal">Tanggal Pemasangan</label>
                    <input type="date" id="tanggal" required>
                </div>
                <div class="form-group">
                    <label for="teknisi">Nama Teknisi</label>
                    <input type="text" id="teknisi" placeholder="Nama Teknisi" required>
                </div>
            </div>
            
            <div class="grid-2">
                <div class="form-group">
                    <label for="sales">Nama Sales</label>
                    <input type="text" id="sales" placeholder="Nama sales" required>
                </div>
                <div class="form-group">
                    <label for="nama">Nama Pelanggan</label>
                    <input type="text" id="nama" placeholder="Nama Sesuai KTP" required>
                </div>
            </div>

            <div class="form-group">
                <label for="hp">No. HP</label>
                <input type="tel" id="hp" placeholder="No telepon" required>
            </div>

            <div class="form-group">
                <label for="alamat">Alamat Lengkap</label>
                <textarea id="alamat" rows="2" placeholder="Alamat" required></textarea>
            </div>

            <button type="submit" id="btnSubmit">Simpan Catatan Pemasangan</button>
        </form>
    </div>

    <!-- Tabel Data -->
    <div class="card" id="areaCetak">
        <div class="header-table">
            <div>
                <h3>Daftar Pemasangan</h3>
                <span class="counter-badge" id="totalCounter">Total: 0 Pelanggan</span>
            </div>
            <div class="btn-group" id="tombolAksi">
                <button type="button" class="btn-reset" id="btnReset">Reset Data Bulanan</button>
                <button type="button" class="btn-export" id="btnExportImage">📸 Export ke Gambar</button>
            </div>
        </div>

        <!-- Kolom Pencarian -->
        <div class="search-box" id="areaPencarian">
            <input type="text" id="searchInput" placeholder="🔍 Ketik nama Teknisi, Sales, atau Pelanggan untuk mencari...">
        </div>

        <div id="tableWrapper" style="overflow-x: auto;">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Teknisi</th>
                        <th>Sales</th>
                        <th>Nama Pelanggan</th>
                        <th>No. HP</th>
                        <th>Alamat</th>
                        <th class="kolom-aksi">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data akan muncul di sini -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let dataPemasangan = JSON.parse(localStorage.getItem('catatanPemasangan')) || [];
    let editIndex = -1;

    const form = document.getElementById('formPemasangan');
    const tableBody = document.getElementById('tableBody');
    const inputTanggal = document.getElementById('tanggal');
    const btnSubmit = document.getElementById('btnSubmit');
    const totalCounter = document.getElementById('totalCounter'); 
    const searchInput = document.getElementById('searchInput');

    const hariIni = new Date();
    hariIni.setMinutes(hariIni.getMinutes() - hariIni.getTimezoneOffset());
    inputTanggal.value = hariIni.toISOString().split('T')[0];

    // FUNGSI UNTUK MENGURUTKAN TANGGAL
    function sortData() {
        dataPemasangan.sort((a, b) => {
            const [hariA, bulanA, tahunA] = a.tanggal.split('/');
            const [hariB, bulanB, tahunB] = b.tanggal.split('/');
            
            const dateA = new Date(tahunA, bulanA - 1, hariA);
            const dateB = new Date(tahunB, bulanB - 1, hariB);
            
            return dateA - dateB;
        });
    }

    function renderTable() {
        tableBody.innerHTML = '';
        
        const keyword = searchInput.value.toLowerCase();

        let dataTampil = dataPemasangan.map((data, index) => {
            return { ...data, indexAsli: index };
        });

        // Proses filtering (Pencarian)
        if (keyword) {
            dataTampil = dataTampil.filter(data => {
                // Support data lama yang masih pakai property "team"
                const namaTeknisi = (data.teknisi || data.team || '').toLowerCase();
                const namaSales = (data.sales || '').toLowerCase();
                
                return namaTeknisi.includes(keyword) || 
                       namaSales.includes(keyword) ||
                       data.nama.toLowerCase().includes(keyword) || 
                       data.alamat.toLowerCase().includes(keyword);
            });
            totalCounter.innerHTML = `Pencarian: ${dataTampil.length} Pelanggan`;
            totalCounter.style.backgroundColor = 'var(--warning-color)';
            totalCounter.style.color = '#000';
        } else {
            totalCounter.innerHTML = `Total: ${dataPemasangan.length} Pelanggan`;
            totalCounter.style.backgroundColor = '#e9ecef';
            totalCounter.style.color = 'var(--primary-color)';
        }

        // Render baris tabel
        dataTampil.forEach((data) => {
            // Backup data lama agar tidak error
            const teksTeknisi = data.teknisi || data.team || '-';
            const teksSales = data.sales || '-';
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${data.tanggal}</td>
                <td><strong>${teksTeknisi}</strong></td>
                <td><strong>${teksSales}</strong></td>
                <td>${data.nama}</td>
                <td>${data.hp}</td>
                <td>${data.alamat}</td>
                <td class="kolom-aksi">
                    <div class="btn-aksi">
                        <button type="button" class="btn-edit" onclick="editData(${data.indexAsli})">Edit</button>
                        <button type="button" class="btn-delete" onclick="hapusData(${data.indexAsli})">Hapus</button>
                    </div>
                </td>
            `;
            tableBody.appendChild(tr);
        });
    }

    searchInput.addEventListener('input', renderTable);

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const dateValue = inputTanggal.value;
        const [tahun, bulan, hari] = dateValue.split('-');
        const formatTanggalID = `${parseInt(hari)}/${parseInt(bulan)}/${tahun}`;

        const newData = {
            tanggal: formatTanggalID,
            teknisi: document.getElementById('teknisi').value.toUpperCase(),
            sales: document.getElementById('sales').value.toUpperCase(),
            nama: document.getElementById('nama').value.toUpperCase(),
            hp: document.getElementById('hp').value,
            alamat: document.getElementById('alamat').value.toUpperCase()
        };

        if (editIndex === -1) {
            dataPemasangan.push(newData);
        } else {
            dataPemasangan[editIndex] = newData;
            editIndex = -1;
            btnSubmit.innerHTML = 'Simpan Catatan Pemasangan';
            btnSubmit.style.backgroundColor = 'var(--primary-color)';
        }

        sortData();
        localStorage.setItem('catatanPemasangan', JSON.stringify(dataPemasangan));

        // Bersihkan form
        document.getElementById('teknisi').value = '';
        document.getElementById('sales').value = '';
        document.getElementById('nama').value = '';
        document.getElementById('hp').value = '';
        document.getElementById('alamat').value = '';
        
        renderTable();
    });

    function editData(index) {
        const data = dataPemasangan[index];
        
        const parts = data.tanggal.split('/');
        if(parts.length === 3) {
            const hariEdit = parts[0].padStart(2, '0');
            const bulanEdit = parts[1].padStart(2, '0');
            const tahunEdit = parts[2];
            inputTanggal.value = `${tahunEdit}-${bulanEdit}-${hariEdit}`;
        }

        // Support data lama (fallback ke data.team)
        document.getElementById('teknisi').value = data.teknisi || data.team || '';
        document.getElementById('sales').value = data.sales || '';
        document.getElementById('nama').value = data.nama || '';
        document.getElementById('hp').value = data.hp || '';
        document.getElementById('alamat').value = data.alamat || '';

        editIndex = index;
        
        btnSubmit.innerHTML = '🔄 Update Catatan Pemasangan';
        btnSubmit.style.backgroundColor = 'var(--info-color)';
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function hapusData(index) {
        if(confirm('Apakah Anda yakin ingin menghapus data ini?')) {
            dataPemasangan.splice(index, 1);
            
            if(editIndex === index) {
                editIndex = -1;
                btnSubmit.innerHTML = 'Simpan Catatan Pemasangan';
                btnSubmit.style.backgroundColor = 'var(--primary-color)';
                form.reset();
                inputTanggal.value = hariIni.toISOString().split('T')[0];
            }
            
            localStorage.setItem('catatanPemasangan', JSON.stringify(dataPemasangan));
            renderTable();
        }
    }

    // FITUR EXPORT
    document.getElementById('btnExportImage').addEventListener('click', function() {
        if(dataPemasangan.length === 0) {
            alert('Tidak ada data untuk diekspor!');
            return;
        }

        const btnExport = document.getElementById('btnExportImage');
        const teksAsli = btnExport.innerHTML;
        btnExport.innerHTML = 'Memproses Gambar...';

        document.getElementById('tombolAksi').style.display = 'none';
        document.getElementById('areaPencarian').style.display = 'none';
        
        const semuaKolomAksi = document.querySelectorAll('.kolom-aksi');
        semuaKolomAksi.forEach(el => el.style.display = 'none');

        const areaCetak = document.getElementById('areaCetak');
        const tableWrapper = document.getElementById('tableWrapper');

        const originalOverflow = tableWrapper.style.overflowX;
        const originalWidth = areaCetak.style.width;

        tableWrapper.style.overflowX = 'visible';
        areaCetak.style.width = tableWrapper.scrollWidth + 'px'; 

        html2canvas(areaCetak, {
            scale: 2,
            backgroundColor: "#ffffff"
        }).then(canvas => {
            tableWrapper.style.overflowX = originalOverflow;
            areaCetak.style.width = originalWidth;
            
            document.getElementById('tombolAksi').style.display = 'flex';
            document.getElementById('areaPencarian').style.display = 'block';
            semuaKolomAksi.forEach(el => el.style.display = '');
            btnExport.innerHTML = teksAsli;

            const stringTanggal = new Date().toLocaleDateString('id-ID').replace(/\//g, '-');
            const link = document.createElement("a");
            link.download = `Rekap_Pemasangan_${stringTanggal}.png`;
            link.href = canvas.toDataURL("image/png");
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }).catch(err => {
            alert("Terjadi kesalahan saat memproses gambar.");
            tableWrapper.style.overflowX = originalOverflow;
            areaCetak.style.width = originalWidth;
            document.getElementById('tombolAksi').style.display = 'flex';
            document.getElementById('areaPencarian').style.display = 'block';
            semuaKolomAksi.forEach(el => el.style.display = '');
            btnExport.innerHTML = teksAsli;
        });
    });

    document.getElementById('btnReset').addEventListener('click', function() {
        if(dataPemasangan.length === 0) {
            alert('Data sudah kosong.');
            return;
        }
        
        const konfirmasi = confirm('PENTING: Apakah Anda sudah menyimpan gambarnya?\n\nTindakan ini akan MENGHAPUS SEMUA DATA di tabel untuk memulai bulan baru. Lanjutkan?');
        
        if(konfirmasi) {
            dataPemasangan = [];
            localStorage.removeItem('catatanPemasangan');
            
            searchInput.value = '';
            renderTable();
            alert('Data berhasil di-reset. Siap untuk catatan bulan baru!');
        }
    });

    sortData();
    renderTable();
</script>

</body>
</html>
