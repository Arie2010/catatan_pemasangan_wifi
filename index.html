<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Catatan Pemasangan Jaringan</title>
    <style>
        :root {
            --primary-color: #0d6efd;
            --bg-color: #f8f9fa;
            --text-color: #333;
            --border-color: #dee2e6;
            --success-color: #198754;
            --warning-color: #ffc107;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
        }
        .header h2 {
            margin-bottom: 5px;
            font-size: 22px;
        }
        .header p {
            margin-top: 0;
            font-size: 14px;
            color: #666;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            opacity: 0.9;
        }
        .header-table {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        .header-table h3 {
            margin: 0;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn-export {
            background-color: var(--success-color);
            width: auto;
            font-size: 13px;
        }
        .btn-reset {
            background-color: var(--warning-color);
            color: #000;
            width: auto;
            font-size: 13px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table th, table td {
            padding: 10px;
            border: 1px solid var(--border-color);
            text-align: left;
            font-size: 13px;
        }
        table th {
            background-color: var(--primary-color);
            color: white;
            white-space: nowrap;
        }
        table tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        .btn-delete {
            background-color: #dc3545;
            padding: 5px 10px;
            font-size: 12px;
            width: auto;
        }
        
        /* CSS Khusus Layar HP */
        @media (max-width: 600px) {
            .grid-2 {
                grid-template-columns: 1fr;
                gap: 0px;
            }
            .header-table {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-group {
                flex-direction: column;
            }
            .btn-export, .btn-reset {
                width: 100%;
            }
        }
    </style>
    <!-- Library untuk mengambil gambar dari HTML -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Sistem Catatan Pemasangan</h2>
        <p>Formulir Pendataan Instalasi Pelanggan Baru</p>
    </div>

    <!-- Form Input -->
    <div class="card">
        <form id="formPemasangan">
            
            <div class="grid-2">
                <div class="form-group">
                    <label for="tanggal">Tanggal Pemasangan</label>
                    <input type="date" id="tanggal" required>
                </div>
                <div class="form-group">
                    <label for="team">Nama Team / Teknisi</label>
                    <input type="text" id="team" placeholder="Nama Team" required>
                </div>
            </div>
            
            <div class="grid-2">
                <div class="form-group">
                    <label for="nama">Nama Pelanggan</label>
                    <input type="text" id="nama" placeholder="Nama Sesuai KTP" required>
                </div>
                <div class="form-group">
                    <label for="hp">No. HP</label>
                    <input type="tel" id="hp" placeholder="No telepon" required>
                </div>
            </div>

            <div class="form-group">
                <label for="alamat">Alamat Lengkap</label>
                <textarea id="alamat" rows="2" placeholder="Alamat" required></textarea>
            </div>

            <div class="form-group">
                <label for="pppoe">Akun PPPoE</label>
                <input type="text" id="pppoe" placeholder="Nama PPPOE" required>
            </div>

            <button type="submit">Simpan Catatan Pemasangan</button>
        </form>
    </div>

    <!-- Tabel Data (Area ini yang akan diubah jadi gambar) -->
    <div class="card" id="areaCetak">
        <div class="header-table">
            <h3>Daftar Pemasangan</h3>
            <div class="btn-group" id="tombolAksi">
                <button type="button" class="btn-reset" id="btnReset">Reset Data Bulanan</button>
                <button type="button" class="btn-export" id="btnExportImage">📸 Export ke Gambar</button>
            </div>
        </div>
        <div style="overflow-x: auto;">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Team</th>
                        <th>Nama</th>
                        <th>No. HP</th>
                        <th>Alamat</th>
                        <th>PPPoE</th>
                        <!-- Tambahan class khusus agar bisa disembunyikan saat cetak -->
                        <th class="kolom-aksi">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data akan muncul di sini -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let dataPemasangan = JSON.parse(localStorage.getItem('catatanPemasangan')) || [];

    const form = document.getElementById('formPemasangan');
    const tableBody = document.getElementById('tableBody');
    const inputTanggal = document.getElementById('tanggal');

    const hariIni = new Date();
    hariIni.setMinutes(hariIni.getMinutes() - hariIni.getTimezoneOffset());
    inputTanggal.value = hariIni.toISOString().split('T')[0];

    function renderTable() {
        tableBody.innerHTML = '';
        dataPemasangan.forEach((data, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${data.tanggal}</td>
                <td><strong>${data.team}</strong></td>
                <td>${data.nama}</td>
                <td>${data.hp}</td>
                <td>${data.alamat}</td>
                <td><code>${data.pppoe}</code></td>
                <td class="kolom-aksi"><button class="btn-delete" onclick="hapusData(${index})">Hapus</button></td>
            `;
            tableBody.appendChild(tr);
        });
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const dateValue = inputTanggal.value;
        const [tahun, bulan, hari] = dateValue.split('-');
        const formatTanggalID = `${parseInt(hari)}/${parseInt(bulan)}/${tahun}`;

        const newData = {
            tanggal: formatTanggalID,
            team: document.getElementById('team').value.toUpperCase(),
            nama: document.getElementById('nama').value.toUpperCase(),
            hp: document.getElementById('hp').value,
            alamat: document.getElementById('alamat').value.toUpperCase(),
            pppoe: document.getElementById('pppoe').value
        };

        dataPemasangan.push(newData);
        localStorage.setItem('catatanPemasangan', JSON.stringify(dataPemasangan));

        document.getElementById('team').value = '';
        document.getElementById('nama').value = '';
        document.getElementById('hp').value = '';
        document.getElementById('alamat').value = '';
        document.getElementById('pppoe').value = '';
        
        renderTable();
    });

    function hapusData(index) {
        if(confirm('Apakah Anda yakin ingin menghapus data ini?')) {
            dataPemasangan.splice(index, 1);
            localStorage.setItem('catatanPemasangan', JSON.stringify(dataPemasangan));
            renderTable();
        }
    }

    // FITUR EXPORT KE GAMBAR (PNG)
    document.getElementById('btnExportImage').addEventListener('click', function() {
        if(dataPemasangan.length === 0) {
            alert('Tidak ada data untuk diekspor!');
            return;
        }

        // Ubah teks tombol menjadi indikator loading
        const btnExport = document.getElementById('btnExportImage');
        const teksAsli = btnExport.innerHTML;
        btnExport.innerHTML = 'Memproses Gambar...';

        // 1. Sembunyikan tombol-tombol dan kolom aksi (hapus) agar gambar terlihat rapi
        document.getElementById('tombolAksi').style.display = 'none';
        const semuaKolomAksi = document.querySelectorAll('.kolom-aksi');
        semuaKolomAksi.forEach(el => el.style.display = 'none');

        // 2. Tentukan area yang mau dijadikan gambar (Card Tabel)
        const areaCetak = document.getElementById('areaCetak');

        // 3. Proses pembuatan gambar
        html2canvas(areaCetak, {
            scale: 2, // Menggunakan skala 2 agar hasil gambar HD dan tidak pecah saat di-zoom
            backgroundColor: "#ffffff" // Background putih bersih
        }).then(canvas => {
            // 4. Kembalikan tampilan tombol dan kolom aksi seperti semula
            document.getElementById('tombolAksi').style.display = 'flex';
            semuaKolomAksi.forEach(el => el.style.display = '');
            btnExport.innerHTML = teksAsli;

            // 5. Buat file download-nya
            const stringTanggal = new Date().toLocaleDateString('id-ID').replace(/\//g, '-');
            const link = document.createElement("a");
            link.download = `Rekap_Pemasangan_${stringTanggal}.png`; // Format .png
            link.href = canvas.toDataURL("image/png");
            
            // Klik link secara otomatis untuk mendownload
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }).catch(err => {
            alert("Terjadi kesalahan saat memproses gambar.");
            // Kembalikan tampilan jika error
            document.getElementById('tombolAksi').style.display = 'flex';
            semuaKolomAksi.forEach(el => el.style.display = '');
            btnExport.innerHTML = teksAsli;
        });
    });

    document.getElementById('btnReset').addEventListener('click', function() {
        if(dataPemasangan.length === 0) {
            alert('Data sudah kosong.');
            return;
        }
        
        const konfirmasi = confirm('PENTING: Apakah Anda sudah menyimpan gambarnya?\n\nTindakan ini akan MENGHAPUS SEMUA DATA di tabel untuk memulai bulan baru. Lanjutkan?');
        
        if(konfirmasi) {
            dataPemasangan = [];
            localStorage.removeItem('catatanPemasangan');
            renderTable();
            alert('Data berhasil di-reset. Siap untuk catatan bulan baru!');
        }
    });

    renderTable();
</script>

</body>
</html>
